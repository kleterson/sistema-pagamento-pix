<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout de Pagamento</title>
  <!-- Mercado Pago SDK v2 -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <!-- Socket.io Client -->
  <script src="https://sistema-pagamento-pix.onrender.com/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(rgba(10, 20, 30, 0.75), rgba(10, 20, 30, 0.85)), 
                  url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.96);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      width: 100%;
      max-width: 480px;
      padding: 30px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1a252f;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid #009ee3;
      background-color: #fff;
      color: #009ee3;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background-color: #009ee3;
      color: #fff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      background-color: #fff;
    }

    input:focus, select:focus {
      border-color: #009ee3;
    }

    .mp-input-box {
      height: 45px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 12px;
      background-color: #fff;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #009ee3;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-submit:hover {
      background-color: #0081b8;
    }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .copia-cola-box {
      width: 100%;
      padding: 10px;
      background: #f0f0f0;
      border: 1px dashed #bbb;
      border-radius: 6px;
      word-break: break-all;
      font-size: 13px;
      margin-bottom: 10px;
      text-align: center;
    }

    .copiado-aviso {
      display: none;
      background-color: #e3f2fd;
      color: #0d47a1;
      border: 1px solid #bbdefb;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
      margin-top: 8px;
      text-align: center;
      animation: fadeIn 0.3s;
    }

    .sucesso-box {
      background-color: #e8f5e9;
      border: 2px solid #2e7d32;
      border-radius: 10px;
      padding: 25px 15px;
      text-align: center;
      margin-top: 20px;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .sucesso-icone {
      font-size: 50px;
      color: #2e7d32;
      margin-bottom: 10px;
    }

    .sucesso-titulo {
      color: #1b5e20;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .sucesso-texto {
      color: #388e3c;
      font-size: 15px;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Sons -->
  <audio id="somSucesso" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>
  <audio id="somCopia" src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3" preload="auto"></audio>

  <div class="container">
    <h2>Escolha a forma de pagamento</h2>

    <div class="tabs">
      <button class="tab-btn active" onclick="mostrarAba('pix')">⚡ Pix</button>
      <button class="tab-btn" onclick="mostrarAba('cartao')">💳 Cartão</button>
    </div>

    <!-- ABA PIX -->
    <div id="abaPix">
      <div class="form-group">
        <label for="valorPix">Valor (R$):</label>
        <input type="text" id="valorPix" value="10,00">
      </div>
      <button class="btn-submit" onclick="gerarPixFixo()">Gerar QR Code Pix</button>

      <div id="resultadoPix" class="qr-container"></div>
    </div>

    <!-- ABA CARTÃO -->
    <div id="abaCartao" style="display: none;">
      <form id="formCartao">
        <div class="form-group">
          <label>Número do Cartão:</label>
          <div id="formCartao-cardNumber" class="mp-input-box"></div>
        </div>

        <div class="form-group" style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label>Validade:</label>
            <div id="formCartao-expirationDate" class="mp-input-box"></div>
          </div>
          <div style="flex: 1;">
            <label>CVV:</label>
            <div id="formCartao-securityCode" class="mp-input-box"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="cardholderName">Nome no Cartão:</label>
          <input type="text" id="cardholderName" placeholder="Como está impresso no cartão">
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label for="docNumber">CPF:</label>
          <input type="text" id="docNumber" placeholder="Somente números">
        </div>

        <div class="form-group">
          <label for="installments">Parcelas:</label>
          <select id="installments"></select>
        </div>

        <div class="form-group">
          <label for="issuer">Banco Emissor:</label>
          <select id="issuer"></select>
        </div>

        <button type="submit" class="btn-submit" id="btnPagarCartao">Pagar com Cartão</button>
      </form>
    </div>

    <div id="resultadoCartao" style="margin-top: 15px;"></div>
  </div>

  <script>
    const socket = io("https://sistema-pagamento-pix.onrender.com");
    let mpInstance = null;
    let cardFormInstance = null;

    // Recebe notificação de pagamento aprovado via Socket
    socket.on('pagamento_confirmado', (data) => {
      exibirTelaSucesso(data.valor);
    });

    function exibirTelaSucesso(valor) {
      const audio = document.getElementById('somSucesso');
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(e => console.log(e));
      }

      const divResultado = document.getElementById('resultadoPix');
      divResultado.innerHTML = `
        <div class="sucesso-box">
          <div class="sucesso-icone">✔</div>
          <div class="sucesso-titulo">Pagamento Confirmado!</div>
          <div class="sucesso-texto">Recebemos o seu pagamento de <strong>R$ ${valor}</strong> com sucesso.</div>
        </div>
      `;
    }

    function mostrarAba(aba) {
      const btnPix = document.querySelectorAll('.tab-btn')[0];
      const btnCartao = document.querySelectorAll('.tab-btn')[1];
      const abaPix = document.getElementById('abaPix');
      const abaCartao = document.getElementById('abaCartao');

      if (aba === 'pix') {
        btnPix.classList.add('active');
        btnCartao.classList.remove('active');
        abaPix.style.display = 'block';
        abaCartao.style.display = 'none';
      } else {
        btnCartao.classList.add('active');
        btnPix.classList.remove('active');
        abaCartao.style.display = 'block';
        abaPix.style.display = 'none';

        // Inicializa os campos do Cartão do Mercado Pago
        inicializarCartaoMercadoPago();
      }
    }

    // Inicializador seguro do Cartão
    async function inicializarCartaoMercadoPago() {
      if (cardFormInstance) return; // Evita recarregar se já inicializou

      try {
        // Toca em seu backend para pegar a chave pública se necessário ou usa SDK v2
        const mp = new MercadoPago('APP_USR-70133504-c8c3-4d26-a05d-c6a655dd0e6f', { locale: 'pt-BR' });
        
        cardFormInstance = mp.cardForm({
          amount: "10.00",
          iframe: true,
          form: {
            id: "formCartao",
            cardNumber: { id: "formCartao-cardNumber", placeholder: "0000 0000 0000 0000" },
            expirationDate: { id: "formCartao-expirationDate", placeholder: "MM/AA" },
            securityCode: { id: "formCartao-securityCode", placeholder: "123" },
            cardholderName: { id: "cardholderName" },
            issuer: { id: "issuer" },
            installments: { id: "installments" },
            identificationNumber: { id: "docNumber" },
            cardholderEmail: { id: "email" }
          },
          callbacks: {
            onFormMounted: error => {
              if (error) return console.warn("Erro ao carregar campos de cartão:", error);
            },
            onSubmit: event => {
              event.preventDefault();
              const {
                paymentMethodId: payment_method_id,
                issuerId: issuer_id,
                cardholderEmail: email,
                token,
                installments,
                identificationNumber: docNumber
              } = cardFormInstance.getCardFormData();

              document.getElementById('btnPagarCartao').innerText = "Processando...";

              fetch("https://sistema-pagamento-pix.onrender.com/api/cartao/pagar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  token,
                  issuer_id,
                  payment_method_id,
                  transaction_amount: 10.00,
                  installments: Number(installments),
                  email,
                  cpf: docNumber
                })
              })
              .then(res => res.json())
              .then(data => {
                document.getElementById('btnPagarCartao').innerText = "Pagar com Cartão";
                if(data.success) {
                  exibirTelaSucesso("10.00");
                } else {
                  alert("Erro no pagamento: " + (data.error || "Dados recusados."));
                }
              })
              .catch(err => {
                document.getElementById('btnPagarCartao').innerText = "Pagar com Cartão";
                alert("Erro ao conectar com o servidor.");
              });
            }
          }
        });
      } catch (err) {
        console.error("Erro no SDK Mercado Pago:", err);
      }
    }

    // --- LÓGICA DO PIX ---
    async function gerarPixFixo() {
      document.getElementById('somSucesso').load();
      document.getElementById('somCopia').load();

      const divResultado = document.getElementById('resultadoPix');
      divResultado.innerHTML = '<p style="text-align: center; color: #666;">Gerando QR Code...</p>';

      try {
        let valorInput = document.getElementById('valorPix').value;
        valorInput = valorInput.replace(',', '.');
        const valorNum = parseFloat(valorInput);

        if (isNaN(valorNum) || valorNum <= 0) {
          divResultado.innerHTML = `<p style="color:red;">Por favor, digite um valor válido.</p>`;
          return;
        }

        const res = await fetch('https://sistema-pagamento-pix.onrender.com/api/pix/valor-fixo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ valor: valorNum })
        });

        const data = await res.json();

        if (data.success) {
          divResultado.innerHTML = `
            <img src="data:image/jpeg;base64,${data.qrCodeBase64}" alt="QR Code Pix" style="width: 200px; height: 200px; margin-bottom: 15px;">
            <div class="copia-cola-box">${data.copiaECola}</div>
            <button class="btn-submit" style="background:#28a745;" onclick="copiarPix('${data.copiaECola}')">📋 Copiar Código Pix</button>
            <div id="avisoCopiado" class="copiado-aviso">📋 Código Pix copiado! Abra o app do seu banco e cole para pagar.</div>
            <p style="margin-top: 15px; font-size: 13px; color: #666; text-align: center;">Aguardando confirmação do pagamento...</p>
          `;
        } else {
          divResultado.innerHTML = `<p style="color:red;">Erro Mercado Pago: ${data.error}</p>`;
        }
      } catch (err) {
        console.error(err);
        divResultado.innerHTML = `<p style="color:red;">Erro ao se conectar ao servidor.</p>`;
      }
    }

    function copiarPix(codigo) {
      navigator.clipboard.writeText(codigo);

      const audioCopia = document.getElementById('somCopia');
      if (audioCopia) {
        audioCopia.currentTime = 0;
        audioCopia.play().catch(e => console.log(e));
      }

      const aviso = document.getElementById('avisoCopiado');
      if (aviso) {
        aviso.style.display = 'block';
      }
    }
  </script>
</body>
</html>
