<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout de Pagamento</title>
  <!-- Mercado Pago SDK v2 -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <!-- Socket.io Client -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      padding: 30px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid #009ee3;
      background-color: #fff;
      color: #009ee3;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background-color: #009ee3;
      color: #fff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #009ee3;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #009ee3;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-submit:hover {
      background-color: #0081b8;
    }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .qr-container img {
      width: 200px;
      height: 200px;
      margin-bottom: 15px;
    }

    .copia-cola-box {
      width: 100%;
      padding: 10px;
      background: #f0f0f0;
      border: 1px dashed #bbb;
      border-radius: 6px;
      word-break: break-all;
      font-size: 13px;
      margin-bottom: 10px;
      text-align: center;
    }

    .notificacao {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .notificacao.sucesso {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .notificacao.erro {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Escolha a forma de pagamento</h2>

    <div class="tabs">
      <button class="tab-btn active" onclick="mostrarAba('pix')">⚡ Pix</button>
      <button class="tab-btn" onclick="mostrarAba('cartao')">💳 Cartão</button>
    </div>

    <!-- ABA PIX -->
    <div id="abaPix">
      <div class="form-group">
        <label for="valorPix">Valor (R$):</label>
        <input type="number" id="valorPix" value="10.00" step="0.01" min="1">
      </div>
      <button class="btn-submit" onclick="gerarPixFixo()">Gerar QR Code Pix</button>

      <div id="resultadoPix" class="qr-container"></div>
    </div>

    <!-- ABA CARTÃO -->
    <div id="abaCartao" style="display: none;">
      <form id="formCartao">
        <div class="form-group">
          <label>Número do Cartão:</label>
          <div id="formCartao-cardNumber" style="height: 45px; border: 1px solid #ccc; border-radius: 6px; padding: 5px;"></div>
        </div>

        <div class="form-group" style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label>Validade:</label>
            <div id="formCartao-expirationDate" style="height: 45px; border: 1px solid #ccc; border-radius: 6px; padding: 5px;"></div>
          </div>
          <div style="flex: 1;">
            <label>CVV:</label>
            <div id="formCartao-securityCode" style="height: 45px; border: 1px solid #ccc; border-radius: 6px; padding: 5px;"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="cardholderName">Nome no Cartão:</label>
          <input type="text" id="cardholderName" placeholder="Como está no cartão">
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label for="docNumber">CPF:</label>
          <input type="text" id="docNumber" placeholder="Somente números">
        </div>

        <div class="form-group">
          <label for="installments">Parcelas:</label>
          <select id="installments"></select>
        </div>

        <div class="form-group">
          <label for="issuer">Banco Emissor:</label>
          <select id="issuer"></select>
        </div>

        <button type="submit" class="btn-submit" id="btnPagarCartao">Pagar com Cartão</button>
      </form>
    </div>

    <div id="notificacao" class="notificacao"></div>
  </div>

  <script>
    // Conexão via WebSocket (funciona automaticamente local ou na nuvem)
    const socket = io();

    socket.on('pagamento_confirmado', (data) => {
      exibirNotificacao(`🎉 Pagamento de R$ ${data.valor} APROVADO com sucesso!`, 'sucesso');
      document.getElementById('resultadoPix').innerHTML = '';
    });

    function mostrarAba(aba) {
      const btnPix = document.querySelectorAll('.tab-btn')[0];
      const btnCartao = document.querySelectorAll('.tab-btn')[1];
      const abaPix = document.getElementById('abaPix');
      const abaCartao = document.getElementById('abaCartao');

      if (aba === 'pix') {
        btnPix.classList.add('active');
        btnCartao.classList.remove('active');
        abaPix.style.display = 'block';
        abaCartao.style.display = 'none';
      } else {
        btnCartao.classList.add('active');
        btnPix.classList.remove('active');
        abaCartao.style.display = 'block';
        abaPix.style.display = 'none';
      }
    }

    // --- LÓGICA DO PIX ---
    async function gerarPixFixo() {
      const divResultado = document.getElementById('resultadoPix');
      divResultado.innerHTML = '<p style="text-align: center; color: #666;">Gerando QR Code...</p>';
      ocultarNotificacao();

      try {
        const valor = document.getElementById('valorPix').value;
        const res = await fetch('/api/pix/valor-fixo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ valor: valor })
        });

        const data = await res.json();

        if (data.success) {
          divResultado.innerHTML = `
            <img src="data:image/jpeg;base64,${data.qrCodeBase64}" alt="QR Code Pix">
            <div class="copia-cola-box">${data.copiaECola}</div>
            <button class="btn-submit" style="background:#28a745;" onclick="copiarPix('${data.copiaECola}')">📋 Copiar Código Pix</button>
          `;
        } else {
          divResultado.innerHTML = `<p style="color:red;">Erro: ${data.error}</p>`;
        }
      } catch (err) {
        divResultado.innerHTML = `<p style="color:red;">Erro ao se conectar ao servidor.</p>`;
      }
    }

    function copiarPix(codigo) {
      navigator.clipboard.writeText(codigo);
      alert('Código Pix copiado para a área de transferência!');
    }

    function exibirNotificacao(mensagem, tipo) {
      const notif = document.getElementById('notificacao');
      notif.innerText = mensagem;
      notif.className = `notificacao ${tipo}`;
      notif.style.display = 'block';
    }

    function ocultarNotificacao() {
      document.getElementById('notificacao').style.display = 'none';
    }
  </script>
</body>
</html>
