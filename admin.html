<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Administrativo - Vendas Pix</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 20px; color: #1a252f; text-align: center; }
    
    /* Cards de Resumo */
    .cards-grid { display: flex; gap: 15px; margin-bottom: 25px; }
    .card-stat { flex: 1; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
    .card-stat h3 { margin: 0; font-size: 14px; color: #7f8c8d; text-transform: uppercase; }
    .card-stat .valor { font-size: 24px; font-weight: bold; margin-top: 10px; color: #2c3e50; }
    .card-stat.verde .valor { color: #27ae60; }
    .card-stat.amarelo .valor { color: #f39c12; }

    /* Tabela */
    .tabela-container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; color: #555; font-weight: 600; }
    tr:hover { background: #f8f9fa; }
    
    /* Badges de Status */
    .badge { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .badge-aprovado { background: #e8f8f0; color: #27ae60; }
    .badge-pendente { background: #fef9e7; color: #f39c12; }

    .topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .btn-atualizar { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-atualizar:hover { background: #2980b9; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📊 Painel de Vendas Pix</h1>

    <!-- Indicadores no Topo -->
    <div class="cards-grid">
      <div class="card-stat verde">
        <h3>Total Aprovado</h3>
        <div class="valor" id="statTotalAprovado">R$ 0,00</div>
      </div>
      <div class="card-stat verde">
        <h3>Vendas Concluídas</h3>
        <div class="valor" id="statQtdAprovadas">0</div>
      </div>
      <div class="card-stat amarelo">
        <h3>Aguardando Pagamento</h3>
        <div class="valor" id="statQtdPendentes">0</div>
      </div>
    </div>

    <!-- Tabela de Histórico -->
    <div class="tabela-container">
      <div class="topo-bar">
        <h3>Histórico de Transações</h3>
        <button class="btn-atualizar" onclick="carregarHistorico()">🔄 Atualizar</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID Pagamento</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Data / Hora</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo">
          <tr><td colspan="4" style="text-align:center;">Carregando histórico...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const socket = io('http://localhost:3000');

    // Sempre que um pagamento for confirmado no servidor, atualiza o painel automaticamente
    socket.on('pagamento_confirmado', () => {
      carregarHistorico();
    });

    async function carregarHistorico() {
      try {
        const res = await fetch('http://localhost:3000/api/historico');
        const data = await res.json();

        if (data.success) {
          renderizarTabela(data.pagamentos);
        }
      } catch (err) {
        console.error('Erro ao carregar histórico:', err);
      }
    }

    function renderizarTabela(pagamentos) {
      const corpo = document.getElementById('tabelaCorpo');
      let html = '';

      let totalAprovado = 0;
      let qtdAprovadas = 0;
      let qtdPendentes = 0;

      if (pagamentos.length === 0) {
        corpo.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhuma transação registrada ainda.</td></tr>';
        return;
      }

      pagamentos.forEach(p => {
        const valorNum = parseFloat(p.valor);
        const dataFormatada = new Date(p.data_criacao).toLocaleString('pt-BR');

        if (p.status === 'APROVADO') {
          totalAprovado += valorNum;
          qtdAprovadas++;
        } else {
          qtdPendentes++;
        }

        const badgeClass = p.status === 'APROVADO' ? 'badge-aprovado' : 'badge-pendente';

        html += `
          <tr>
            <td><code>${p.id}</code></td>
            <td><strong>R$ ${valorNum.toFixed(2).replace('.', ',')}</strong></td>
            <td><span class="badge ${badgeClass}">${p.status}</span></td>
            <td>${dataFormatada}</td>
          </tr>
        `;
      });

      corpo.innerHTML = html;

      // Atualiza os Cards de Estatísticas
      document.getElementById('statTotalAprovado').innerText = `R$ ${totalAprovado.toFixed(2).replace('.', ',')}`;
      document.getElementById('statQtdAprovadas').innerText = qtdAprovadas;
      document.getElementById('statQtdPendentes').innerText = qtdPendentes;
    }

    // Carrega os dados assim que abre a página
    carregarHistorico();
  </script>
</body>
</html>
