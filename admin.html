<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Vendas</title>
  <!-- Socket.io Client -->
  <script src="https://sistema-pagamento-pix.onrender.com/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      padding: 30px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .cards-grid {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      flex: 1;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
    }

    .card h3 {
      font-size: 14px;
      color: #777;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .card .valor {
      font-size: 24px;
      font-weight: bold;
      color: #009ee3;
    }

    .historico-box {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .historico-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-atualizar {
      padding: 8px 15px;
      background-color: #009ee3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-atualizar:hover {
      background-color: #007bb5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    th {
      color: #555;
      background-color: #fafafa;
    }

    .status-aprovado {
      color: #2e7d32;
      font-weight: bold;
      background: #e8f5e9;
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📊 Painel de Vendas Pix</h2>

    <div class="cards-grid">
      <div class="card">
        <h3>Total Aprovado</h3>
        <div class="valor" id="totalAprovado">R$ 0,00</div>
      </div>
      <div class="card">
        <h3>Vendas Concluídas</h3>
        <div class="valor" id="vendasConcluidas">0</div>
      </div>
      <div class="card">
        <h3>Aguardando Pagamento</h3>
        <div class="valor" id="aguardandoPagamento">0</div>
      </div>
    </div>

    <div class="historico-box">
      <div class="historico-header">
        <h3>Histórico de Transações</h3>
        <button class="btn-atualizar" onclick="carregarHistorico()">🔄 Atualizar</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID Pagamento</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Data / Hora</th>
          </tr>
        </thead>
        <tbody id="tabelaHistorico">
          <tr>
            <td colspan="4" style="text-align: center; color: #666;">Carregando histórico...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const socket = io("https://sistema-pagamento-pix.onrender.com");

    // Atualiza em tempo real quando houver um novo pagamento
    socket.on('pagamento_confirmado', (data) => {
      carregarHistorico();
    });

    async function carregarHistorico() {
      try {
        const res = await fetch('https://sistema-pagamento-pix.onrender.com/api/transacoes');
        const data = await res.json();

        const tbody = document.getElementById('tabelaHistorico');
        tbody.innerHTML = '';

        if (!data.success || data.transacoes.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #666;">Nenhuma transação encontrada.</td></tr>`;
          return;
        }

        let total = 0;
        let concluidas = 0;

        data.transacoes.forEach(t => {
          if (t.status === 'aprovado') {
            total += t.valor;
            concluidas++;
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${t.id}</td>
            <td>R$ ${t.valor.toFixed(2).replace('.', ',')}</td>
            <td><span class="status-aprovado">${t.status}</span></td>
            <td>${t.data}</td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('totalAprovado').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        document.getElementById('vendasConcluidas').innerText = concluidas;
        document.getElementById('aguardandoPagamento').innerText = 0;

      } catch (err) {
        console.error(err);
        document.getElementById('tabelaHistorico').innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Erro ao carregar dados do servidor.</td></tr>`;
      }
    }

    // Carrega ao abrir a página
    carregarHistorico();
  </script>
</body>
</html>
